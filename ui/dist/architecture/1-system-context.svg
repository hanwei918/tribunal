<text x="930" y="436" font-size="16" fill="#FFFFFF" font-weight="bold" text-anchor="middle" data-box="trib">Tribunal</text>
<text x="930" y="454" font-size="11.5" fill="#FFFFFF" text-anchor="middle" data-box="trib">[Software System: Python 3.9-3.13, standard library only]</text>
<text x="930" y="475" font-size="11" fill="#FFFFFF" font-weight="bold" text-anchor="middle" data-box="trib">calls a large language model</text>
<text x="930" y="503" font-size="12.5" fill="#FFFFFF" text-anchor="middle" data-box="trib">Decides one ride dispute against a versioned policy. Two advocates</text>
<text x="930" y="520" font-size="12.5" fill="#FFFFFF" text-anchor="middle" data-box="trib">argue from one brief; a four-draft judge panel votes; deterministic</text>
<text x="930" y="537" font-size="12.5" fill="#FFFFFF" text-anchor="middle" data-box="trib">checks gate every draft. A case it may not decide is escalated to</text>
<text x="930" y="554" font-size="12.5" fill="#FFFFFF" text-anchor="middle" data-box="trib">a person. Every step is written to a hash-chained record.</text>
